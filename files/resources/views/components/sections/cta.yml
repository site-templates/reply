# The closing invitation. The painting runs the full width behind a canvas
# scrim — the one place on the site where the photography takes the whole
# section rather than sitting inside a frame.
title: Closing call to action
description: A centred invitation over a full-bleed painting
fields:
    heading:
        type: textarea
        label: Heading
        rows: 2
        default: "Give your team their mornings back."
    body:
        type: textarea
        label: Supporting copy
        rows: 3
        default: "Connect an inbox, point Reply at your help centre, and watch what a week looks like. Nothing to build, no card, no sales call."
    ctaText:
        type: text
        label: Primary button text
        default: "Start free"
    ctaLink:
        type: url
        label: Primary button link
        default: "/pricing"
    showSecondary:
        type: toggle
        label: Show the second button
        default: "1"
    secondaryText:
        type: text
        label: Second button text
        default: "Talk to a human"
    secondaryLink:
        type: url
        label: Second button link
        default: "mailto:hello@reply.support"
    footnote:
        type: text
        label: Footnote
        default: "Set up in about ten minutes. Cancel in one click."
    image:
        type: image
        label: Backdrop painting
        default: "/images/bloom.jpg"
    imageAlt:
        type: text
        label: Alt text
        default: "A painterly stand of white wildflowers rising through sage grasses"
