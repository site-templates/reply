# The Insights product row. The four topic percentages drive the bar widths
# directly — change a number and the chart moves with it.
title: Insights row
description: The Insights screen on a photograph, with the argument for it opposite
fields:
    align:
        type: select
        label: Screen side
        default: "left"
        options:
            left: Left
            right: Right
    eyebrow:
        type: text
        label: Eyebrow
        default: "Why Reply"
    heading:
        type: textarea
        label: Heading
        rows: 2
        default: "It gets sharper with every ticket it sees."
    body:
        type: textarea
        label: Body
        rows: 4
        default: "Every conversation your team resolves becomes a worked example. Reply picks up the edge cases, the exceptions, and the phrases your customers actually use, so the answers get more accurate the longer it runs."
    pointOne:
        type: text
        label: First bullet
        default: "Learns from resolved tickets, not just documentation"
    pointTwo:
        type: text
        label: Second bullet
        default: "Flags the questions your help centre cannot answer"
    pointThree:
        type: text
        label: Third bullet
        description: Leave empty to show fewer.
        default: ""
    showCta:
        type: toggle
        label: Show the link
        default: "1"
    ctaText:
        type: text
        label: Link text
        default: "Read a customer story"
    ctaLink:
        type: url
        label: Link
        default: "/customers"
    image:
        type: image
        label: Photograph behind the screen
        default: "/images/insight.jpg"
    imageAlt:
        type: text
        label: Photograph alt text
        default: "Morning sun through tall meadow grasses"
    appTitle:
        type: text
        label: Screen title
        default: "Insights"
    appMeta:
        type: text
        label: Screen period
        default: "Last 30 days"
    rateFigure:
        type: text
        label: First figure
        default: "92%"
    rateLabel:
        type: text
        label: First figure label
        default: "Resolved without an agent"
    rateDelta:
        type: text
        label: First figure change
        default: "+12"
    volumeFigure:
        type: text
        label: Second figure
        default: "8,420"
    volumeLabel:
        type: text
        label: Second figure label
        default: "Conversations closed"
    volumeDelta:
        type: text
        label: Second figure change
        default: "+18"
    breakdownLabel:
        type: text
        label: Breakdown heading
        default: "By topic"
    topicOne:
        type: text
        label: Topic 1
        default: "Order status"
    topicOnePercent:
        type: number
        label: Topic 1 percent
        min: 0
        max: 100
        default: "34"
    topicTwo:
        type: text
        label: Topic 2
        default: "Returns and refunds"
    topicTwoPercent:
        type: number
        label: Topic 2 percent
        min: 0
        max: 100
        default: "26"
    topicThree:
        type: text
        label: Topic 3
        default: "Account and login"
    topicThreePercent:
        type: number
        label: Topic 3 percent
        min: 0
        max: 100
        default: "18"
    topicFour:
        type: text
        label: Topic 4
        default: "Billing"
    topicFourPercent:
        type: number
        label: Topic 4 percent
        min: 0
        max: 100
        default: "12"
